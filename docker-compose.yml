name: hermex

services:
  inventory-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inventory-service
    restart: unless-stopped
    expose:
      - "3002"
      - "50053"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      METRICS_PORT: 3002
      GRPC_PORT: 50053

      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USERNAME: ${DB_USERNAME:-hermex_admin}
      DB_PASSWORD: ${DB_PASSWORD:-hermex_password}
      DB_NAME: ${DB_NAME:-inventory_db}
      DB_SYNCHRONIZE: ${DB_SYNCHRONIZE:-true}
      RABBITMQ_URL: ${RABBITMQ_URL:-amqp://hermex_user:hermex_password@rabbitmq:5672}
    networks:
      - hermex-network

networks:
  hermex-network:
    name: hermex-network
    external: true
